services:
  - type: web
    name: kbeauty-intel
    runtime: python
    rootDir: CellFusionC_intel
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      # MCP 엔드포인트(/mcp) Bearer 보호.
      - key: MCP_API_KEY
        sync: false
      # ── 대화형 Slack 봇 (Socket Mode) — web 프로세스 내 in-process 기동 ──
      # 별도 워커 없이 web 상시가동에 얹혀 24/7. MCP는 자기 자신(localhost) 조회.
      # web 서비스 env에 아래 두 토큰만 추가하면 봇이 자동 기동됨.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      # 봇 모델: 질문마다 호출 → 비용 위해 mini (브리핑·인사이트만 gpt-4o)
      - key: SLACK_BOT_MODEL
        value: gpt-4o-mini
